<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b91c1c">
  <style>
  :root {
    --verm: #b91c1c; --verm2: #fee2e2; --verde: #15803d; --verde2: #dcfce7;
    --amar: #a16207; --amar2: #fef3c7; --azul: #1d4ed8; --azul2: #dbeafe;
    --cinza: #475569; --cinza2: #f1f5f9; --borda: #cbd5e1; --texto: #0f172a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f8fafc; color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px 96px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 21px; margin: 6px 0 12px; }
  h3 { font-size: 18px; margin: 16px 0 8px; color: var(--cinza); }
  p { margin: 6px 0; line-height: 1.35; }
  .sub { color: var(--cinza); font-size: 15px; }
  .carregando { padding: 60px 0; text-align: center; color: var(--cinza); }

  #faixa { position: sticky; top: 0; z-index: 5; }
  .faixa { padding: 7px 14px; font-size: 15px; font-weight: 600; text-align: center; }
  .faixa.teste { background: #7c3aed; color: #fff; }
  .faixa.fila { background: var(--amar2); color: var(--amar); }
  .faixa.off { background: #334155; color: #fff; }

  .topo { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topo .voltar { border: 0; background: var(--cinza2); font-size: 18px; padding: 10px 14px; border-radius: 12px; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; }
  .chip.ok { background: var(--verde2); color: var(--verde); }
  .chip.neg { background: var(--verm2); color: var(--verm); }
  .chip.am { background: var(--amar2); color: var(--amar); }
  .chip.az { background: var(--azul2); color: var(--azul); }

  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .menu button { min-height: 118px; border: 0; border-radius: 18px; font-size: 19px; font-weight: 700;
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .menu button .ic { font-size: 38px; line-height: 1; }
  .menu .b-saida { background: #dc2626; }
  .menu .b-dev { background: #16a34a; }
  .menu .b-eq { background: #ea580c; }
  .menu .b-saldo { background: #2563eb; }
  .menu .b-nao { background: #64748b; }
  .menu .b-hoje { background: #0f766e; }

  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 17px 14px; font-size: 19px;
    font-weight: 700; margin: 10px 0; }
  .btn.prim { background: var(--verde); color: #fff; }
  .btn.sec { background: var(--cinza2); color: var(--texto); border: 2px solid var(--borda); }
  .btn.perigo { background: var(--verm); color: #fff; }
  .btn:disabled { opacity: .45; }
  .linkbtn { background: none; border: 0; color: var(--azul); font-size: 16px; text-decoration: underline; padding: 8px 0; }

  input, select, textarea { width: 100%; font-size: 19px; padding: 13px 12px; border: 2px solid var(--borda);
    border-radius: 12px; background: #fff; color: var(--texto); }
  input:focus, select:focus { outline: 3px solid var(--azul2); border-color: var(--azul); }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .opcao { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
    width: 100%; border: 2px solid var(--borda); background: #fff; border-radius: 14px; padding: 13px 14px; font-size: 18px; }
  .opcao:active, .opcao.sel { border-color: var(--azul); background: var(--azul2); }
  .opcao .cod { font-size: 13px; color: var(--cinza); font-weight: 700; letter-spacing: .3px; }
  .opcao .desc { font-weight: 600; }
  .opcao .dir { text-align: right; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chips button { border: 2px solid var(--borda); background: #fff; border-radius: 12px; padding: 10px 12px;
    font-size: 17px; font-weight: 700; }
  .chips button.sel { background: var(--azul); border-color: var(--azul); color: #fff; }

  .cartao { background: #fff; border: 2px solid var(--borda); border-radius: 16px; padding: 14px; margin: 10px 0; }
  .grande { font-size: 46px; font-weight: 800; line-height: 1.1; }
  .item-carrinho { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--borda); }
  .item-carrinho:last-child { border-bottom: 0; }
  .item-carrinho .txt { flex: 1; min-width: 0; }
  .qtd { display: flex; align-items: center; gap: 6px; }
  .qtd button { width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--borda); background: #fff; font-size: 24px; font-weight: 800; }
  .qtd input { width: 74px; text-align: center; padding: 10px 4px; }
  .x { border: 0; background: none; font-size: 24px; color: var(--verm); padding: 6px; }

  table.quadro { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.quadro th, table.quadro td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  table.quadro th { font-size: 13px; color: var(--cinza); text-transform: uppercase; }
  .alerta { background: var(--amar2); color: #713f12; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-weight: 600; }
  .erro { background: var(--verm2); color: #7f1d1d; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-weight: 600; }
  .okbox { background: var(--verde2); color: #14532d; border-radius: 12px; padding: 14px; margin: 8px 0; font-weight: 600; }
  .pergunta { font-size: 20px; font-weight: 800; margin: 18px 0 8px; }

  .assin-wrap { position: relative; background: #fff; border: 2px dashed var(--cinza); border-radius: 14px; }
  canvas#assin { display: block; width: 100%; height: 210px; touch-action: none; border-radius: 14px; }
  .assin-wrap .linha { position: absolute; left: 16px; right: 16px; bottom: 44px; border-bottom: 2px solid var(--borda); pointer-events: none; }
  .assin-wrap .dica { position: absolute; left: 16px; bottom: 14px; color: var(--cinza); font-size: 14px; pointer-events: none; }

  .pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 16px auto; }
  .pin button { height: 64px; font-size: 26px; font-weight: 800; border-radius: 14px; border: 2px solid var(--borda); background: #fff; }
  .pin-vis { text-align: center; font-size: 34px; letter-spacing: 14px; min-height: 46px; }

  .aviso { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 20; max-width: 616px; margin: 0 auto;
    background: #0f172a; color: #fff; padding: 14px 16px; border-radius: 14px; font-size: 17px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .escondido { display: none; }
  .rodape { margin-top: 22px; text-align: center; color: var(--cinza); font-size: 14px; }
</style>

</head>

function instalarTeste() {
  const hoje = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  const pasta = DriveApp.createFolder('APP ALMOXARIFADO - TESTE ' + hoje);
  const est = DriveApp.getFileById(IDS_REAIS.ESTOQUE).makeCopy('TESTE - Controle de Estoque - Materiais', pasta);
  const eq = DriveApp.getFileById(IDS_REAIS.EQUIP).makeCopy('TESTE - Controle de Ferramentas e Equipamentos', pasta);
  const ass = pasta.createFolder('ASSINATURAS APP');
  const reg = criarRegistro_(pasta, 'TESTE - App Almoxarifado - Registro');
  salvarConfig_({
    MODO: 'TESTE',
    PLANILHA_ESTOQUE_ID: est.getId(),
    PLANILHA_EQUIP_ID: eq.getId(),
    PLANILHA_REGISTRO_ID: reg,
    PASTA_ASSINATURAS_ID: ass.getId(),
    SEQ_APP: '0'
  });
  Logger.log('TESTE pronto. Pasta: ' + pasta.getUrl());
  return pasta.getUrl();
}

    SEQ_APP: c.MODO === 'PRODUCAO' ? (c.SEQ_APP || '0') : '0'
  });
  Logger.log('PRODUÇÃO configurada.');
}

/** PIN de 4 dígitos para abrir o app. definirPin('') desliga o PIN. */
function definirPin(pin) {
  salvarConfig_({ PIN: String(pin || '') });
}

/** Modo pré-inventário (POP-02): SIM = saldo negativo não bloqueia; NAO = pede confirmação. */
function definirPreInventario(sim) {
  salvarConfig_({ PRE_INVENTARIO: sim ? 'SIM' : 'NAO' });
}

function verConfig() {
  Logger.log(JSON.stringify(cfg_(), null, 2));
}

function criarRegistro_(pasta, nome) {
  const ss = SpreadsheetApp.create(nome);
  const log = ss.getSheets()[0];
  log.setName('Log');
  log.appendRow(['ID da operação', 'Data/hora', 'Tipo', 'Número', 'Pessoa', 'Itens', 'Assinatura', 'Avisos', 'Detalhe (JSON)']);
  log.setFrozenRows(1);
  const pend = ss.insertSheet('Pendencias');
  pend.appendRow(['Data/hora', 'Tipo', 'Descrição', 'Quantidade', 'Pessoa', 'Observação', 'Situação', 'Número']);
  pend.setFrozenRows(1);
  const leia = ss.insertSheet('LEIA-ME');
  leia.getRange(1, 1, 4, 1).setValues([
    ['Registro do App do Almoxarifado. Não apagar linhas.'],

    ['Pendencias: item não encontrado no Cadastro, material NÃO ACEITO (POP-08) e ferramenta com defeito.'],
    ['As pendências são resolvidas no lote das 15h30 pelos agentes (POP-04 / POP-08) e marcadas como RESOLVIDA.']
  ]);
  DriveApp.getFileById(ss.getId()).moveTo(pasta);
  return ss.getId();
}

function obterOuCriarPasta_(pai, nome) {
  const it = pai.getFoldersByName(nome);
  return it.hasNext() ? it.next() : pai.createFolder(nome);
}

function cfg_() {
  return PropertiesService.getScriptProperties().getProperties();
}

function salvarConfig_(obj) {
  PropertiesService.getScriptProperties().setProperties(obj, false);
}

function exigirCfg_() {
  const c = cfg_();
  if (!c.PLANILHA_ESTOQUE_ID || !c.PLANILHA_EQUIP_ID || !c.PLANILHA_REGISTRO_ID) {
    throw new Error('O app ainda não foi instalado. Peça ao Mário para rodar instalarTeste().');
  }
  return c;
}

function checarPin_(c, pin) {
  if (c.PIN && String(pin || '') !== String(c.PIN)) throw new Error('PIN_INVALIDO');
}

// ---------------------------------------------------------------- Utilidades

function norm_(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toUpperCase().replace(/\s+/g, ' ').trim();
}

function num_(v) {
  if (typeof v === 'number') return v;
  const s = String(v == null ? '' : v).trim();
  if (!s) return 0;
  const n = Number(s.indexOf(',') >= 0 ? s.replace(/\./g, '').replace(',', '.') : s);
  return isNaN(n) ? 0 : n;
}

/** Converte célula (Date ou 'dd/mm/aaaa') em 'aaaa-mm-dd'. */
function eData_(v) {
  return Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime());
}

function chaveData_(v) {
  if (eData_(v)) return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  return '';
}

/** 'aaaa-mm-dd' -> Date à meia-noite (fuso do script). */
function dataDeChave_(k) {
  const m = String(k || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) throw new Error('Data inválida.');
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function hojeChave_() {
  return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
}

function dataBR_(k) {
  const m = String(k).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(k);
}

function aba_(ss, nome) {
  const sh = ss.getSheetByName(nome);
  if (!sh) throw new Error('Não achei a aba "' + nome + '" na planilha ' + ss.getName() + '.');
  return sh;
}

function valores_(sh) {
  const n = sh.getLastRow();
  const m = sh.getLastColumn();
  if (n < 1 || m < 1) return [];
  return sh.getRange(1, 1, n, m).getValues();
}

/** Primeira linha vazia olhando a coluna A (as colunas automáticas não contam). */
function proximaLinha_(sh) {
  const n = sh.getLastRow();
  if (n < 2) return 2;
  const col = sh.getRange(1, 1, n, 1).getValues();
  for (let i = n - 1; i >= 0; i--) {
    if (String(col[i][0]).trim() !== '') return i + 2;
  }
  return 2;
}

/**
 * Grava uma linha só nas colunas informadas, em blocos contíguos,
 * sem tocar nas outras (fórmulas automáticas).
 * cels: { coluna(1-based): valor }, texto: [colunas gravadas como texto], datas: [colunas de data]
 */
function gravarLinha_(sh, linha, cels, texto, datas) {
  if (linha > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 50);
  const cols = Object.keys(cels).map(Number).sort(function (a, b) { return a - b; });
  let i = 0;
  while (i < cols.length) {
    let j = i;
    while (j + 1 < cols.length && cols[j + 1] === cols[j] + 1) j++;
    const ini = cols[i];
    const vals = [];
    for (let k = i; k <= j; k++) vals.push(cels[cols[k]]);
    const rg = sh.getRange(linha, ini, 1, vals.length);
    const fmts = [];
    for (let k = i; k <= j; k++) {
      const c = cols[k];
      fmts.push((texto || []).indexOf(c) >= 0 ? '@' : (datas || []).indexOf(c) >= 0 ? 'dd/mm/yyyy' : null);
    }
    if (fmts.some(function (f) { return f; })) {
      const atuais = rg.getNumberFormats()[0];
      rg.setNumberFormats([fmts.map(function (f, idx) { return f || atuais[idx]; })]);
    }
    rg.setValues([vals]);
    i = j + 1;
  }
}

function temTexto_(x) {
  return x != null && String(x).trim() !== '';
}

function pad_(n, t) {
  return ('000000' + n).slice(-t);
}

function proximoApp_() {
  const p = PropertiesService.getScriptProperties();
  const n = Number(p.getProperty('SEQ_APP') || '0') + 1;
  p.setProperty('SEQ_APP', String(n));
  return 'APP-' + pad_(n, 5);
}

// ---------------------------------------------------------------- Leitura

function lerCadastro_(ss) {
  const v = valores_(aba_(ss, 'Cadastro'));
  const out = [];
  for (let i = 1; i < v.length; i++) {
    const cod = String(v[i][0]).trim();
    if (!cod) continue;
    out.push({ c: cod, d: String(v[i][1]), u: String(v[i][2]), s: String(v[i][4] || cod.split('-')[0]), st: String(v[i][7] || '') });
  }
  return out;
}

function lerSaldos_(ss) {
  const v = valores_(aba_(ss, 'Estoque'));
  const out = {};
  for (let i = 1; i < v.length; i++) {
    const cod = String(v[i][0]).trim();
    if (!cod) continue;
    out[cod] = { saldo: num_(v[i][8]), sit: String(v[i][10] || ''), ult: chaveData_(v[i][3]), un: String(v[i][2] || '') };
  }
  return out;
}

function lerSetores_(ss) {
  const v = valores_(aba_(ss, 'Setores'));
  const out = [];
  for (let i = 1; i < v.length; i++) if (String(v[i][0]).trim()) out.push({ c: String(v[i][0]).trim(), n: String(v[i][1]) });
  return out;
}

var RE_DEVOLVIDO = /devolvido por\s+([^·|]+)/i;

/** Saídas e devoluções de material, por pessoa e por item. */
function lerMovMaterial_(ss) {
  const s = valores_(aba_(ss, 'Saidas'));
  const e = valores_(aba_(ss, 'Entradas'));
  const saidas = [];
  for (let i = 1; i < s.length; i++) {
    if (!String(s[i][0]).trim() && !String(s[i][2]).trim()) continue;
    saidas.push({ data: chaveData_(s[i][0]), num: String(s[i][1]).trim(), cod: String(s[i][2]).trim(), qtd: num_(s[i][4]), pessoa: String(s[i][6]).trim() });
  }
  const devs = [];
  const numsEntradas = [];
  for (let i = 1; i < e.length; i++) {
    numsEntradas.push(String(e[i][1]).trim());
    if (norm_(e[i][2]) !== 'DEVOLUCAO DE CAMPO') continue;
    const m = String(e[i][8] || '').match(RE_DEVOLVIDO);
    devs.push({ data: chaveData_(e[i][0]), num: String(e[i][1]).trim(), cod: String(e[i][3]).trim(), qtd: num_(e[i][5]), pessoa: m ? m[1].trim() : '' });
  }
  return { saidas: saidas, devs: devs, numsSaidas: saidas.map(function (x) { return x.num; }), numsEntradas: numsEntradas };
}

/** O que cada pessoa retirou e ainda não devolveu: { PESSOA_NORM: { nome, itens: {cod: qtd} } } */
function emAbertoPorPessoa_(mov) {
  const out = {};
  function add(p, cod, q) {
    if (!p) return;
    const k = norm_(p);
    if (!out[k]) out[k] = { nome: p, itens: {} };
    out[k].itens[cod] = (out[k].itens[cod] || 0) + q;
  }
  mov.saidas.forEach(function (x) { add(x.pessoa, x.cod, x.qtd); });
  mov.devs.forEach(function (x) { add(x.pessoa, x.cod, -x.qtd); });
  Object.keys(out).forEach(function (k) {
    Object.keys(out[k].itens).forEach(function (c) { if (out[k].itens[c] <= 0) delete out[k].itens[c]; });
  });
  return out;
}

function maxFolhaLinha_(lista, prefixo) {
  const re = new RegExp(prefixo + '-(\\d{3})-(\\d{2})');
  let f = 0, l = 0;
  lista.forEach(function (s) {
    const m = String(s).match(re);
    if (!m) return;
    const ff = Number(m[1]), ll = Number(m[2]);
    if (ff > f || (ff === f && ll > l)) { f = ff; l = ll; }
  });
  return { folha: f, linha: l };
}

function proximaFolhaLinha_(ult) {
  if (!ult.folha) return { folha: 1, linha: 1 };
  if (ult.linha >= LINHAS_POR_FOLHA) return { folha: ult.folha + 1, linha: 1 };
  return { folha: ult.folha, linha: ult.linha + 1 };
}

function lerEquip_(sseq) {
  const ev = valores_(aba_(sseq, 'Equipamentos'));
  const mv = valores_(aba_(sseq, 'Movimentacao'));
  const movs = [];
  for (let i = 1; i < mv.length; i++) {
    const cod = String(mv[i][1]).trim();
    if (!cod) continue;
    movs.push({
      data: chaveData_(mv[i][0]), cod: cod, mov: norm_(mv[i][3]).indexOf('DEV') === 0 ? 'DEV' : 'RET',
      pessoa: String(mv[i][5]).trim(), estado: String(mv[i][6]), obs: String(mv[i][7]), qtd: num_(mv[i][8]) || 1
    });
  }
  const itens = [];
  for (let i = 1; i < ev.length; i++) {
    const cod = String(ev[i][0]).trim();
    if (!cod) continue;
    const lote = num_(ev[i][12]) || 1;
    // quem está com o quê (pelas linhas de Movimentacao)
    const com = {};
    let desde = '';
    movs.filter(function (m) { return m.cod === cod; }).forEach(function (m) {
      const k = norm_(m.pessoa);
      if (!com[k]) com[k] = { nome: m.pessoa, qtd: 0, desde: '' };
      com[k].qtd += m.mov === 'RET' ? m.qtd : -m.qtd;
      if (m.mov === 'RET') com[k].desde = m.data;
    });
    const fora = [];
    let qtdFora = 0;
    Object.keys(com).forEach(function (k) {
      if (com[k].qtd > 0) { fora.push(com[k]); qtdFora += com[k].qtd; if (!desde || com[k].desde < desde) desde = com[k].desde; }
    });
    const resp = String(ev[i][9]).trim();
    // peça única: o responsável atual da aba Equipamentos manda
    if (lote === 1 && resp && !fora.length) { fora.push({ nome: resp, qtd: 1, desde: '' }); qtdFora = 1; }
    itens.push({
      linha: i + 1, c: cod, n: String(ev[i][1]), tipo: String(ev[i][2]), st: String(ev[i][7] || ''),
      local: String(ev[i][8] || ''), resp: resp, lote: lote, fora: fora, qtdFora: qtdFora,
      disp: Math.max(0, lote - qtdFora), desde: desde
    });
  }
  return { itens: itens, movs: movs };
}

function bloqueado_(st) {
  const s = norm_(st);
  return s.indexOf('MANUTEN') >= 0 || s.indexOf('BAIXAD') >= 0;
}

// ---------------------------------------------------------------- API: abrir

function api_iniciar(pin) {
  try {
    const c = exigirCfg_();
    checarPin_(c, pin);
    const ss = SpreadsheetApp.openById(c.PLANILHA_ESTOQUE_ID);
    const sseq = SpreadsheetApp.openById(c.PLANILHA_EQUIP_ID);
    const mov = lerMovMaterial_(ss);
    const eq = lerEquip_(sseq);
    const abertos = emAbertoPorPessoa_(mov);

    // pessoas: mais recentes primeiro
    const vistos = {};
    const pessoas = [];
    mov.saidas.concat(mov.devs).concat(eq.movs).slice().reverse().forEach(function (x) {
      const k = norm_(x.pessoa);
      if (k && !vistos[k]) { vistos[k] = 1; pessoas.push(x.pessoa); }
    });

    return {
      ok: true,
      versao: VERSAO_APP,
      teste: c.MODO !== 'PRODUCAO',
      preInventario: c.PRE_INVENTARIO !== 'NAO',
      hoje: hojeChave_(),
      cadastro: lerCadastro_(ss),
      saldos: lerSaldos_(ss),
      setores: lerSetores_(ss),
      pessoas: pessoas.slice(0, 40),
      abertos: abertos,
      equip: eq.itens.map(function (x) { delete x.linha; return x; }),
      proxCad: proximaFolhaLinha_(maxFolhaLinha_(mov.numsSaidas.concat(mov.numsEntradas), 'CAD')),
      proxCeq: proximaFolhaLinha_(maxFolhaLinha_(eq.movs.map(function (m) { return m.obs; }), 'CEQ')),
      linhasPorFolha: LINHAS_POR_FOLHA,
      pecas: PECAS,
      atualizadoEm: Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'dd/MM HH:mm')
    };
  } catch (e) {
    return { ok: false, erro: e.message };
  }
}

// ---------------------------------------------------------------- API: lançar

/**
 * Recebe uma operação confirmada pelo Jean. Idempotente pelo op.id
 * (se a internet cair e o celular reenviar, não grava duas vezes).
 */
function api_registrar(op) {
  let lock;
  try {
    const c = exigirCfg_();
    checarPin_(c, op && op.pin);
    if (!op || !op.id || !op.tipo) throw new Error('Operação incompleta.');
    lock = LockService.getScriptLock();
    lock.waitLock(30000);
    const reg = SpreadsheetApp.openById(c.PLANILHA_REGISTRO_ID);
    const anterior = buscarLog_(reg, op.id);
    if (anterior) return { ok: true, repetido: true, numero: anterior.numero, avisos: ['Este lançamento já tinha sido gravado. Nada foi repetido.'] };

    let res;
    if (op.tipo === 'SAIDA') res = registrarSaida_(c, op);
    else if (op.tipo === 'DEVOLUCAO') res = registrarDevolucao_(c, op, reg);
    else if (op.tipo === 'RETIRADA_EQ' || op.tipo === 'DEVOLUCAO_EQ') res = registrarEquip_(c, op, reg);
    else if (op.tipo === 'PENDENCIA') res = registrarPendencia_(reg, op);
    else throw new Error('Tipo de operação desconhecido: ' + op.tipo);

    gravarLog_(reg, op, res);
    return { ok: true, numero: res.numero, linhas: res.linhas, avisos: res.avisos || [] };
  } catch (e) {
    return { ok: false, erro: e.message };
  } finally {
    if (lock) try { lock.releaseLock(); } catch (x) { /* nada */ }
  }
}

function buscarLog_(reg, id) {
  const sh = aba_(reg, 'Log');
  const n = sh.getLastRow();
  if (n < 2) return null;
  const v = sh.getRange(2, 1, n - 1, 4).getValues();
  for (let i = v.length - 1; i >= 0; i--) if (String(v[i][0]) === String(id)) return { numero: String(v[i][3]) };
  return null;
}

function gravarLog_(reg, op, res) {
  const itens = (op.itens || []).map(function (i) { return (i.codigo || i.descricao) + ' x' + i.qtd + (i.estado ? ' (' + i.estado + ')' : ''); }).join('; ');
  const det = JSON.parse(JSON.stringify(op));
  if (det.assinatura) delete det.assinatura.png;
  delete det.pin;
  aba_(reg, 'Log').appendRow([
    op.id, new Date(), op.tipo, res.numero || '', op.pessoa || '', itens,
    res.assinatura || '', (res.avisos || []).join(' | '), JSON.stringify(det)
  ]);
}

function validarBase_(op, precisaItens) {
  if (!String(op.pessoa || '').trim()) throw new Error('Falta o nome de quem retira ou devolve.');
  const k = String(op.data || '');
  dataDeChave_(k);
  if (k > hojeChave_()) throw new Error('A data não pode ser no futuro.');
  if (precisaItens && (!op.itens || !op.itens.length)) throw new Error('Nenhum item na lista.');
  (op.itens || []).forEach(function (i) {
    if (!(num_(i.qtd) > 0)) throw new Error('Quantidade inválida para ' + (i.codigo || i.descricao) + '.');
  });
  const a = op.assinatura || {};
  const soRecusados = op.tipo === 'DEVOLUCAO' && (op.itens || []).every(function (i) { return i.estado === 'NAO_ACEITO'; });
  if (soRecusados) return; // nada entra no saldo: só vira pendência (POP-08)
  if (a.modo === 'tela') {
    if (!a.png || String(a.png).indexOf('data:image/png;base64,') !== 0) throw new Error('Falta a assinatura na tela.');
  } else if (a.modo === 'papel') {
    if (!(Number(a.folha) > 0) || !(Number(a.linha) > 0)) throw new Error('Falta a folha e a linha do caderno.');
    if (Number(a.linha) + (op.itens || [1]).length - 1 > LINHAS_POR_FOLHA) {
      throw new Error('Os itens passam da linha ' + LINHAS_POR_FOLHA + ' da folha. Use a folha seguinte para o resto.');
    }
  } else {
    throw new Error('Escolha como foi a assinatura: na tela ou no caderno.');
  }
}

/** Números de documento por item: papel = CAD-FFF-LL (um por linha); tela = APP-nnnnn (um para todos). */
function numerosDoc_(op, prefixo, existentes, filtro) {
  const a = op.assinatura;
  const out = [];
  if (a.modo === 'papel') {
    // cada item ocupa uma linha do caderno, na ordem da lista (inclusive os NÃO ACEITO)
    for (let i = 0; i < op.itens.length; i++) {
      if (filtro && !filtro(op.itens[i])) continue;
      const n = prefixo + '-' + pad_(Number(a.folha), 3) + '-' + pad_(Number(a.linha) + i, 2);
      if (existentes(n)) throw new Error('A linha ' + n + ' já foi lançada antes. Confira a folha e a linha do caderno.');
      out.push(n);
    }
  }
  return out;
}

function salvarAssinatura_(c, op, numero) {
  if (!op.assinatura || op.assinatura.modo !== 'tela') return '';
  const raiz = DriveApp.getFolderById(c.PASTA_ASSINATURAS_ID);
  const pasta = obterOuCriarPasta_(raiz, String(op.data).slice(0, 7));
  const b64 = String(op.assinatura.png).split(',')[1];
  const blob = Utilities.newBlob(Utilities.base64Decode(b64), 'image/png', op.data + '_' + numero + '_' + norm_(op.pessoa).replace(/[^A-Z0-9]+/g, '-') + '.png');
  return pasta.createFile(blob).getUrl();
}

function textoAssinatura_(op, numero) {
  return op.assinatura.modo === 'papel'
    ? 'caderno, folha ' + pad_(Number(op.assinatura.folha), 3) + ' · lançado pelo app'
    : 'app ' + numero + ' · assinatura na tela';
}

// ----- SAÍDA DE MATERIAL (POP-02) -> aba Saidas

function registrarSaida_(c, op) {
  validarBase_(op, true);
  const ss = SpreadsheetApp.openById(c.PLANILHA_ESTOQUE_ID);
  const cad = {};
  lerCadastro_(ss).forEach(function (x) { cad[x.c] = x; });
  const saldos = lerSaldos_(ss);
  const mov = lerMovMaterial_(ss);
  const setores = lerSetores_(ss).map(function (s) { return s.c; });
  if (op.setor && setores.indexOf(op.setor) < 0) throw new Error('Setor ' + op.setor + ' não existe na aba Setores.');

  const pre = c.PRE_INVENTARIO !== 'NAO';
  const avisos = [];
  const consumo = {};
  const obsItem = [];
  op.itens.forEach(function (it) {
    const item = cad[it.codigo];
    if (!item) throw new Error('O código ' + it.codigo + ' não está no Cadastro.');
    if (it.codigo.indexOf('EQP-') === 0) throw new Error(it.codigo + ' é ferramenta/equipamento: use o botão Ferramentas.');
    consumo[it.codigo] = (consumo[it.codigo] || 0) + num_(it.qtd);
    const sal = saldos[it.codigo];
    const antes = sal ? sal.saldo : 0;
    const depois = antes - consumo[it.codigo];
    let nota = '';
    if (!sal || depois < 0 || norm_(sal && sal.sit).indexOf('SEM CONTAGEM') >= 0) {
      if (pre) {
        nota = 'pré-inventário, saldo ' + depois;
        avisos.push(it.codigo + ': saldo ficou ' + depois + ' (pré-inventário).');
      } else if (depois < 0) {
        if (!it.confirmouNegativo) throw new Error('A saída de ' + it.codigo + ' deixa o saldo negativo (' + depois + '). Fale com Julio ou Edton e confirme na tela.');
        nota = 'saldo negativo, conferir entradas';
        avisos.push(it.codigo + ': saldo negativo (' + depois + '). Avisar Julio ou Edton.');
      }
    }
    obsItem.push(nota);
  });

  const existe = function (n) { return mov.numsSaidas.indexOf(n) >= 0 || mov.numsEntradas.indexOf(n) >= 0; };
  let nums = numerosDoc_(op, 'CAD', existe);
  let numero;
  if (op.assinatura.modo === 'tela') {
    numero = proximoApp_();
    nums = op.itens.map(function () { return numero; });
  } else {
    numero = nums.length > 1 ? nums[0] + ' a ' + nums[nums.length - 1].slice(-2) : nums[0];
  }
  const urlAss = salvarAssinatura_(c, op, numero);

  const sh = aba_(ss, 'Saidas');
  let linha = proximaLinha_(sh);
  const data = dataDeChave_(op.data);
  const hoje = dataDeChave_(hojeChave_());
  op.itens.forEach(function (it, i) {
    const obs = [textoAssinatura_(op, numero), obsItem[i], it.obs, op.obs].filter(temTexto_).join(' · ');
    // A data · B nº · C código · [D automática] · E qtd · F setor · G retirante · H obs · I lançado em
    gravarLinha_(sh, linha, { 1: data, 2: nums[i], 3: it.codigo, 5: num_(it.qtd), 6: op.setor || '', 7: op.pessoa.trim(), 8: obs, 9: hoje }, [2], [1, 9]);
    linha++;
  });
  return { numero: numero, linhas: op.itens.length, avisos: avisos, assinatura: urlAss };
}

// ----- DEVOLUÇÃO DE CAMPO (POP-03) -> aba Entradas

function registrarDevolucao_(c, op, reg) {
  validarBase_(op, true);
  const ss = SpreadsheetApp.openById(c.PLANILHA_ESTOQUE_ID);
  const cad = {};
  lerCadastro_(ss).forEach(function (x) { cad[x.c] = x; });
  const mov = lerMovMaterial_(ss);
  const abertos = emAbertoPorPessoa_(mov);
  const pessoaK = norm_(op.pessoa);
  const avisos = [];

  const aceitos = op.itens.filter(function (i) { return i.estado !== 'NAO_ACEITO'; });
  const recusados = op.itens.filter(function (i) { return i.estado === 'NAO_ACEITO'; });

  const usado = {};
  const origens = [];
  aceitos.forEach(function (it) {
    if (!cad[it.codigo]) throw new Error('O código ' + it.codigo + ' não está no Cadastro.');
    usado[it.codigo] = (usado[it.codigo] || 0) + num_(it.qtd);
    const comPessoa = (abertos[pessoaK] && abertos[pessoaK].itens[it.codigo]) || 0;
    const saidasPessoa = mov.saidas.filter(function (s) { return s.cod === it.codigo && norm_(s.pessoa) === pessoaK; });
    if (saidasPessoa.length) {
      if (usado[it.codigo] > comPessoa) {
        throw new Error(op.pessoa + ' só tem ' + comPessoa + ' de ' + it.codigo + ' para devolver. Devolução maior que a saída é divergência: não gravei.');
      }
      origens.push('origem ' + saidasPessoa[saidasPessoa.length - 1].num);
    } else {
      const totSai = mov.saidas.filter(function (s) { return s.cod === it.codigo; }).reduce(function (a, s) { return a + s.qtd; }, 0);
      const totDev = mov.devs.filter(function (s) { return s.cod === it.codigo; }).reduce(function (a, s) { return a + s.qtd; }, 0);
      if (usado[it.codigo] > totSai - totDev) {
        throw new Error('Devolução de ' + it.codigo + ' maior do que tudo que já saiu. É divergência: não gravei.');
      }
      origens.push('origem não localizada');
      avisos.push(it.codigo + ': não achei a saída de ' + op.pessoa + '. Gravei com "origem não localizada".');
    }
  });

  let numero = '';
  let linhas = 0;
  let urlAss = '';
  if (aceitos.length) {
    const existe = function (n) { return mov.numsSaidas.indexOf(n) >= 0 || mov.numsEntradas.indexOf(n) >= 0; };
    let nums = numerosDoc_(op, 'CAD', existe, function (i) { return i.estado !== 'NAO_ACEITO'; });
    if (op.assinatura.modo === 'tela') {
      numero = proximoApp_();
      nums = aceitos.map(function () { return numero; });
    } else {
      numero = nums.length > 1 ? nums[0] + ' a ' + nums[nums.length - 1].slice(-2) : nums[0];
    }
    urlAss = salvarAssinatura_(c, op, numero);
    const sh = aba_(ss, 'Entradas');
    let linha = proximaLinha_(sh);
    const data = dataDeChave_(op.data);
    const hoje = dataDeChave_(hojeChave_());
    aceitos.forEach(function (it, i) {
      const obs = [textoAssinatura_(op, numero), origens[i], 'devolvido por ' + op.pessoa.trim(), op.setor ? 'setor ' + op.setor : '', it.obs, op.obs].filter(temTexto_).join(' · ');
      // A data · B nº · C fornecedor · D código · [E auto] · F qtd · [G vazio] · [H auto] · I obs · J lançado em
      gravarLinha_(sh, linha, { 1: data, 2: nums[i], 3: 'DEVOLUÇÃO DE CAMPO', 4: it.codigo, 6: num_(it.qtd), 9: obs, 10: hoje }, [2], [1, 10]);
      linha++;
    });
    linhas = aceitos.length;
  }
  recusados.forEach(function (it) {
    pendencia_(reg, 'NÃO ACEITO (POP-08)', (it.codigo || '') + ' ' + (it.descricao || ''), it.qtd, op.pessoa,
      'Devolução recusada: material danificado ou usado. Seguir POP-08 (AJUSTE) com Julio ou Edton.', numero);
    avisos.push((it.codigo || it.descricao) + ' x' + it.qtd + ': NÃO ACEITO. Ficou na lista de pendências (POP-08).');
  });
  if (!numero) numero = 'SEM LANÇAMENTO';
  return { numero: numero, linhas: linhas, avisos: avisos, assinatura: urlAss };
}

// ----- FERRAMENTAS E EQUIPAMENTOS (POP-06) -> abas Movimentacao e Equipamentos

function registrarEquip_(c, op, reg) {
  validarBase_(op, true);
  const ret = op.tipo === 'RETIRADA_EQ';
  const sseq = SpreadsheetApp.openById(c.PLANILHA_EQUIP_ID);
  const eq = lerEquip_(sseq);
  const porCod = {};
  eq.itens.forEach(function (x) { porCod[x.c] = x; });
  if (op.setor) {
    const ss = SpreadsheetApp.openById(c.PLANILHA_ESTOQUE_ID);
    if (lerSetores_(ss).map(function (s) { return s.c; }).indexOf(op.setor) < 0) throw new Error('Setor ' + op.setor + ' não existe.');
  }
  const pessoaK = norm_(op.pessoa);
  const avisos = [];
  const refs = [];

  op.itens.forEach(function (it) {
    const x = porCod[it.codigo];
    if (!x) throw new Error('O código ' + it.codigo + ' não está na aba Equipamentos.');
    const q = num_(it.qtd);
    if (ret) {
      if (bloqueado_(x.st)) throw new Error(x.c + ' está "' + x.st + '" e não pode sair.');
      if (x.lote === 1 && x.qtdFora > 0) throw new Error(x.c + ' (' + x.n + ') já está com ' + x.fora[0].nome + '.');
      if (q > x.disp) throw new Error(x.c + ': só tem ' + x.disp + ' disponível no almoxarifado.');
      refs.push('');
    } else {
      const com = x.fora.filter(function (f) { return norm_(f.nome) === pessoaK; })[0];
      if (!com) {
        if (!x.fora.length) throw new Error(x.c + ' consta como no almoxarifado. Não há o que devolver.');
        if (!it.confirmaOutraPessoa) throw new Error(x.c + ' está com ' + x.fora.map(function (f) { return f.nome; }).join(', ') + ', não com ' + op.pessoa + '.');
        avisos.push(x.c + ': estava com ' + x.fora[0].nome + ' e foi devolvido por ' + op.pessoa + '.');
      } else if (q > com.qtd) {
        throw new Error(op.pessoa + ' só tem ' + com.qtd + ' de ' + x.c + '. Não dá para devolver ' + q + '.');
      }
      // referência da retirada (CEQ ou APP) mais recente desta pessoa
      const rets = eq.movs.filter(function (m) { return m.cod === x.c && m.mov === 'RET' && norm_(m.pessoa) === norm_(com ? com.nome : x.fora[0].nome); });
      const ult = rets.length ? (rets[rets.length - 1].obs.match(/(CEQ-\d{3}-\d{2}|APP-\d{5})/) || [])[0] : '';
      refs.push(ult ? 'ref. retirada ' + ult : 'ref. retirada não localizada');
      if (it.estado && it.estado !== 'OK') avisos.push(x.c + ' voltou ' + it.estado.toUpperCase() + '. Avisar Julio, Edton e Mário hoje e separar o item.');
    }
  });

  const existe = function (n) { return eq.movs.some(function (m) { return m.obs.indexOf(n) >= 0; }); };
  let nums = numerosDoc_(op, 'CEQ', existe);
  let numero;
  if (op.assinatura.modo === 'tela') {
    numero = proximoApp_();
    nums = op.itens.map(function () { return numero; });
  } else {
    numero = nums.length > 1 ? nums[0] + ' a ' + nums[nums.length - 1].slice(-2) : nums[0];
  }
  const urlAss = salvarAssinatura_(c, op, numero);

  const shM = aba_(sseq, 'Movimentacao');
  const shE = aba_(sseq, 'Equipamentos');
  let linha = proximaLinha_(shM);
  const data = dataDeChave_(op.data);
  op.itens.forEach(function (it, i) {
    const x = porCod[it.codigo];
    const q = num_(it.qtd);
    const base = op.assinatura.modo === 'papel'
      ? 'caderno, folha ' + pad_(Number(op.assinatura.folha), 3) + ', ' + nums[i] + ' · lançado pelo app'
      : 'app ' + numero + ' · assinatura na tela';
    const obs = [base, ret ? 'estado na saída: ' + (it.estado || 'OK') : refs[i], it.obs, op.obs].filter(temTexto_).join(' · ');
    // A data · B código · [C auto] · D movimento · E setor · F responsável · G estado devolução · H obs · I qtd
    const cels = { 1: data, 2: x.c, 4: ret ? 'saída' : 'devolução', 5: op.setor || '', 6: op.pessoa.trim(), 8: obs, 9: q };
    if (!ret) cels[7] = it.estado || 'OK';
    gravarLinha_(shM, linha, cels, [], [1]);
    linha++;

    // Atualiza status / local / responsável (só H, I, J da linha do item)
    const linE = eq.itens.filter(function (y) { return y.c === x.c; })[0].linha;
    const foraDepois = x.qtdFora + (ret ? q : -q);
    let local, resp, status = x.st;
    if (x.lote === 1) {
      local = ret ? (op.setor || 'Fora do almoxarifado') : 'Almoxarifado';
      resp = ret ? op.pessoa.trim() : '';
      if (!ret && it.estado && it.estado !== 'OK') status = 'Em manutenção';
    } else {
      local = foraDepois <= 0 ? 'Almoxarifado' : 'Parcial: ' + foraDepois + ' fora';
      const mapa = {};
      x.fora.forEach(function (f) { mapa[norm_(f.nome)] = { nome: f.nome, qtd: f.qtd }; });
      const k = ret ? pessoaK : (mapa[pessoaK] ? pessoaK : norm_(x.fora[0] && x.fora[0].nome));
      if (!mapa[k]) mapa[k] = { nome: op.pessoa.trim(), qtd: 0 };
      mapa[k].qtd += ret ? q : -q;
      resp = Object.keys(mapa).filter(function (kk) { return mapa[kk].qtd > 0; }).map(function (kk) { return mapa[kk].nome + ' (' + mapa[kk].qtd + ')'; }).join(', ');
      if (!ret && it.estado && it.estado !== 'OK') {
        pendencia_(reg, 'FERRAMENTA COM DEFEITO', x.c + ' ' + x.n, q, op.pessoa, 'Voltou ' + it.estado + ' (item de lote: status não foi alterado). Separar e avisar Julio, Edton e Mário.', numero);
      }
    }
    gravarLinha_(shE, linE, { 8: status, 9: local, 10: resp }, [], []);
    x.qtdFora = foraDepois; // caso o mesmo item apareça de novo na lista
  });
  return { numero: numero, linhas: op.itens.length, avisos: avisos, assinatura: urlAss };
}

// ----- PENDÊNCIA (item que o Jean não achou no Cadastro) -> Registro/Pendencias

function registrarPendencia_(reg, op) {
  if (!String(op.descricao || '').trim()) throw new Error('Escreva a descrição do material.');
  if (!(num_(op.qtd) > 0)) throw new Error('Quantidade inválida.');
  pendencia_(reg, 'ITEM NÃO ENCONTRADO (' + (op.movimento || 'SAÍDA') + ')', op.descricao, num_(op.qtd), op.pessoa || '',
    'Lançar no lote das 15h30 pelo agente certo (POP-04). ' + (op.obs || ''), '');
  return { numero: 'PENDÊNCIA', linhas: 0, avisos: ['Anotado nas pendências. No lote das 15h30 o agente cadastra o item (POP-04) e lança.'] };
}

function pendencia_(reg, tipo, desc, qtd, pessoa, obs, numero) {
  aba_(reg, 'Pendencias').appendRow([new Date(), tipo, desc, qtd, pessoa, obs, 'ABERTA', numero || '']);
}

// ---------------------------------------------------------------- API: resumo do dia

function api_hoje(pin) {
  try {
    const c = exigirCfg_();
    checarPin_(c, pin);
    const reg = SpreadsheetApp.openById(c.PLANILHA_REGISTRO_ID);
    const tz = Session.getScriptTimeZone();
    const hoje = hojeChave_();
    const lv = valores_(aba_(reg, 'Log'));
    const lanc = [];
    for (let i = 1; i < lv.length; i++) {
      const d = eData_(lv[i][1]) ? Utilities.formatDate(lv[i][1], tz, 'yyyy-MM-dd') : '';
      if (d !== hoje) continue;
      lanc.push({ hora: Utilities.formatDate(lv[i][1], tz, 'HH:mm'), tipo: lv[i][2], numero: lv[i][3], pessoa: lv[i][4], itens: lv[i][5], avisos: lv[i][7] });
    }
    const pv = valores_(aba_(reg, 'Pendencias'));
    const pend = [];
    for (let i = 1; i < pv.length; i++) {
      if (norm_(pv[i][6]) !== 'ABERTA') continue;
      pend.push({ quando: eData_(pv[i][0]) ? Utilities.formatDate(pv[i][0], tz, 'dd/MM HH:mm') : '', tipo: pv[i][1], desc: pv[i][2], qtd: pv[i][3], pessoa: pv[i][4] });
    }
    const eq = lerEquip_(SpreadsheetApp.openById(c.PLANILHA_EQUIP_ID));
    const fora = [];
    eq.itens.forEach(function (x) {
      x.fora.forEach(function (f) {
        fora.push({ c: x.c, n: x.n, nome: f.nome, qtd: f.qtd, desde: f.desde ? dataBR_(f.desde) : '', mais24h: !!(f.desde && f.desde < hoje) });
      });
    });
    return { ok: true, lancamentos: lanc, pendencias: pend, fora: fora };
  } catch (e) {
    return { ok: false, erro: e.message };
  }
}

<script>
/* =====================================================================
   APP ALMOXARIFADO · Escola de Bombeiros · 3 MN
   Tudo roda no celular do almoxarife. Os lançamentos confirmados vão
   para uma FILA guardada no celular e sobem para as planilhas assim que
   houver sinal (sinal fraco não perde nada).
   ===================================================================== */

var CH = { FILA: 'almox_fila_v1', DADOS: 'almox_dados_v1', PIN: 'almox_pin_v1', PROX: 'almox_prox_v1', ERROS: 'almox_erros_v1' };
var SISTEMAS = [
  { s: 'HID', n: 'Água', ic: '💧' }, { s: 'SAN', n: 'Esgoto', ic: '🚽' }, { s: 'ELE', n: 'Elétrica', ic: '⚡' },
  { s: 'CON', n: 'Consumível', ic: '🧴' }, { s: 'FER', n: 'Ferragem', ic: '🔩' }, { s: 'EPI', n: 'Segurança', ic: '🦺' },
  { s: 'EST', n: 'Estrutura', ic: '🏗️' }, { s: 'FOR', n: 'Forma/madeira', ic: '🪵' }, { s: 'DIV', n: 'Diversos', ic: '📦' }
];

var S = {
  dados: null, pin: '', op: null, pk: null, pickCb: null, eqSel: null,
  resultados: {}, enviando: false, offline: false, ultimoId: null, voltarPara: null
};

// ------------------------------------------------------------ utilidades
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); }
function ler(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
function grava(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* cheio */ } }
function hojeLocal() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function br(k) { var m = String(k || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '/' + m[2] + '/' + m[1] : k; }
function uid() { return 'op-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function pad(n, t) { return ('000000' + n).slice(-t); }
function fmtN(n) { n = Number(n) || 0; return (Math.round(n * 100) / 100).toString().replace('.', ','); }
function numBR(v) { return Number(String(v || '').replace(',', '.')) || 0; }
function render(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
function aviso(txt, ms) {
  var a = $('aviso'); a.textContent = txt; a.classList.remove('escondido');
  clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.classList.add('escondido'); }, ms || 3500);
}
function topo(titulo, voltar) {
  return '<div class="topo"><button class="voltar" onclick="' + (voltar || 'telaInicio()') + '">◀ Voltar</button><h2 style="margin:0">' + titulo + '</h2></div>';
}

function rpc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, falha) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
    r[fn].apply(r, args);
  });
}

// ------------------------------------------------------------ dados
function item(cod) {
  var c = S.dados.cadastro;
  for (var i = 0; i < c.length; i++) if (c[i].c === cod) return c[i];
  return null;
}
function saldo(cod) { return S.dados.saldos[cod] || null; }
function chipSaldo(cod) {
  var s = saldo(cod);
  if (!s) return '<span class="chip am">sem saldo</span>';
  var cls = s.saldo < 0 ? 'neg' : (norm(s.sit).indexOf('SEM CONT') >= 0 ? 'am' : 'ok');
  return '<span class="chip ' + cls + '">' + fmtN(s.saldo) + ' ' + esc(s.un || '') + '</span>';
}
function pecaDe(cod) {
  var p = String(cod).split('-');
  return (p.length >= 3 && S.dados.pecas[p[1]]) ? p[1] : 'OUT';
}

function carregar(silencioso) {
  return rpc('api_iniciar', S.pin).then(function (r) {
    if (!r.ok) {
      if (r.erro === 'PIN_INVALIDO') { grava(CH.PIN, ''); S.pin = ''; telaPin(S.pinErrado ? 'PIN errado. Tente de novo.' : ''); S.pinErrado = true; return false; }
      if (!silencioso) render('<div class="erro">' + esc(r.erro) + '</div><button class="btn sec" onclick="location.reload()">Tentar de novo</button>');
      return false;
    }
    S.pinErrado = false;
    S.dados = r; grava(CH.DADOS, r); grava(CH.PIN, S.pin);
    reaplicarFila();
    faixa();
    return true;
  }).catch(function () {
    S.offline = true; faixa();
    if (!S.dados && !silencioso) render('<div class="erro">Sem internet para abrir o app pela primeira vez. Tente de novo quando tiver sinal.</div><button class="btn sec" onclick="location.reload()">Tentar de novo</button>');
    return false;
  });
}

/** Proxima folha/linha do caderno, considerando o que já foi lançado neste celular. */
function proxFolha(pref) {
  var srv = S.dados[pref === 'CAD' ? 'proxCad' : 'proxCeq'];
  var loc = ler(CH.PROX, {})[pref];
  if (loc && (loc.folha > srv.folha || (loc.folha === srv.folha && loc.linha > srv.linha))) return loc;
  return srv;
}
function avancarFolha(pref, folha, linha, n) {
  var p = ler(CH.PROX, {});
  var l = linha + n, f = folha;
  if (l > S.dados.linhasPorFolha) { f++; l = 1; }
  p[pref] = { folha: f, linha: l };
  grava(CH.PROX, p);
}

// ------------------------------------------------------------ fila (sinal fraco)
function fila() { return ler(CH.FILA, []); }

/** Aplica no saldo da tela o que ainda está na fila (para o Jean ver o saldo certo). */
function aplicarLocal(op) {
  var d = S.dados;
  (op.itens || []).forEach(function (it) {
    var q = numBR(it.qtd);
    if (op.tipo === 'SAIDA' || (op.tipo === 'DEVOLUCAO' && it.estado !== 'NAO_ACEITO')) {
      var sinal = op.tipo === 'SAIDA' ? -1 : 1;
      if (!d.saldos[it.codigo]) d.saldos[it.codigo] = { saldo: 0, sit: 'SEM CONTAGEM', un: '' };
      d.saldos[it.codigo].saldo += sinal * q;
      var k = norm(op.pessoa);
      if (!d.abertos[k]) d.abertos[k] = { nome: op.pessoa, itens: {} };
      d.abertos[k].itens[it.codigo] = (d.abertos[k].itens[it.codigo] || 0) - sinal * q;
      if (d.abertos[k].itens[it.codigo] <= 0) delete d.abertos[k].itens[it.codigo];
    }
    if (op.tipo === 'RETIRADA_EQ' || op.tipo === 'DEVOLUCAO_EQ') {
      d.equip.forEach(function (x) {
        if (x.c !== it.codigo) return;
        var ret = op.tipo === 'RETIRADA_EQ';
        var nome = ret ? op.pessoa : (it.de || op.pessoa);
        var f = x.fora.filter(function (y) { return norm(y.nome) === norm(nome); })[0];
        if (!f) { f = { nome: nome, qtd: 0, desde: op.data }; x.fora.push(f); }
        f.qtd += ret ? q : -q;
        if (ret) f.desde = op.data;
        x.fora = x.fora.filter(function (y) { return y.qtd > 0; });
        x.qtdFora = x.fora.reduce(function (a, y) { return a + y.qtd; }, 0);
        x.disp = Math.max(0, x.lote - x.qtdFora);

function processarFila() {
  if (S.enviando) return;

  S.enviando = true;
  var op = f[0];
  rpc('api_registrar', op).then(function (r) {
    S.offline = false;
    var g = fila(); if (g.length && g[0].id === op.id) { g.shift(); grava(CH.FILA, g); }
    S.resultados[op.id] = r;
    if (!r.ok) {
      var e = ler(CH.ERROS, []); e.push({ quando: new Date().toLocaleString('pt-BR'), tipo: op.tipo, pessoa: op.pessoa, itens: resumoItens(op), erro: r.erro });
      grava(CH.ERROS, e);
      if (S.ultimoId !== op.id) aviso('⚠ Um lançamento NÃO foi gravado. Veja na tela inicial.', 6000);
    }
    if (S.ultimoId === op.id && S.telaAtual === 'resultado') telaResultado();
    S.enviando = false;
    if (fila().length) processarFila();
    else { faixa(); setTimeout(function () { if (!fila().length) carregar(true).then(function () { if (S.telaAtual === 'inicio') telaInicio(); }); }, 1500); }
  }).catch(function () {

}

function iniciarCanvas() {

    if ((S.assTracos || 0) < 8) { aviso('Falta a assinatura.'); return; }
    var cv = $('assin');
    var out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    var c2 = out.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, out.width, out.height); c2.drawImage(cv, 0, 0);
    a.png = out.toDataURL('image/png');
  } else if (a.modo === 'papel') {
    if (!(a.folha > 0) || !(a.linha > 0)) { aviso('Falta a folha ou a linha.'); return; }
  } else { aviso('Escolha como foi a assinatura.'); return; }
  passoConfirmar();
}

// ------------------------------------------------------------ CONFIRMAR ("O QUE VOU FAZER")
function passoConfirmar() {
  S.telaAtual = 'confirmar';
  var op = S.op, d = S.dados;
  var titulo = { SAIDA: 'SAÍDA DE MATERIAL', DEVOLUCAO: 'DEVOLUÇÃO DE CAMPO', RETIRADA_EQ: 'RETIRADA DE FERRAMENTA', DEVOLUCAO_EQ: 'DEVOLUÇÃO DE FERRAMENTA' }[op.tipo];
  var eq = op.tipo.indexOf('_EQ') > 0;
  var alertas = [], bloqueio = '';
  var h = '<h2>📋 O QUE VOU FAZER</h2><div class="cartao">' +
    '<p><b>' + titulo + '</b></p>' +
    '<p>' + (op.tipo.indexOf('DEV') === 0 ? 'Quem devolve' : 'Quem retira') + ': <b>' + esc(op.pessoa) + '</b></p>' +
    '<p>Data: <input type="date" style="width:auto;padding:6px 8px;font-size:17px" value="' + op.data + '" max="' + hojeLocal() + '" onchange="S.op.data=this.value"></p>' +
    '<p>Setor: <b>' + esc(op.setor || 'sem setor') + '</b></p>' +
    '<p>Assinatura: <b>' + (op.assinatura.modo === 'tela' ? '✍️ na tela ✔' : op.assinatura.modo === 'papel' ? '📒 caderno, folha ' + pad(op.assinatura.folha, 3) : '—') + '</b></p>';

  h += '<table class="quadro"><tr><th>Item</th><th>Qtd</th><th>' + (eq ? 'Estado' : 'Saldo') + '</th></tr>';
  var consumo = {};
  op.itens.forEach(function (it, i) {
    var col3 = '';
    if (op.tipo === 'SAIDA') {
      consumo[it.codigo] = (consumo[it.codigo] || 0) + it.qtd;
      var s = saldo(it.codigo); var antes = s ? s.saldo : 0; var dep = antes - consumo[it.codigo];
      col3 = fmtN(antes) + ' → <b>' + fmtN(dep) + '</b>';
      it.confirmouNegativo = false;
      if (dep < 0) {
        if (d.preInventario) alertas.push(it.codigo + ': saldo fica ' + fmtN(dep) + '. Pré-inventário: vai gravar e anotar.');
        else {
          col3 += '<br><label style="font-weight:600;margin:6px 0"><input type="checkbox" style="width:auto" onchange="S.op.itens[' + i + '].confirmouNegativo=this.checked;checarConf()"> Saldo negativo. Já falei com Julio ou Edton</label>';
          bloqueio = 'neg';
        }
      }
    } else if (op.tipo === 'DEVOLUCAO') {
      var s2 = saldo(it.codigo); var a2 = s2 ? s2.saldo : 0;
      col3 = it.estado === 'NAO_ACEITO' ? '<span class="chip neg">NÃO ACEITO</span>' : fmtN(a2) + ' → <b>' + fmtN(a2 + it.qtd) + '</b>';
      if (it.estado === 'NAO_ACEITO') alertas.push(it.codigo + ': danificado/usado NÃO entra no saldo. Vai para pendências (POP-08).');
      var ab = d.abertos[norm(op.pessoa)];
      var tem = ab && ab.itens[it.codigo] || 0;
      if (it.estado !== 'NAO_ACEITO' && !tem) alertas.push(it.codigo + ': não achei saída para ' + op.pessoa + '. Vai gravar com "origem não localizada".');
      else if (it.estado !== 'NAO_ACEITO' && it.qtd > tem) { alertas.push(it.codigo + ': ' + op.pessoa + ' só tem ' + fmtN(tem) + '. Devolução maior que a saída não pode.'); bloqueio = 'dev'; }
    } else {
      col3 = esc(it.estado || 'OK');
      if (op.tipo === 'DEVOLUCAO_EQ' && it.estado && it.estado !== 'OK') alertas.push(it.codigo + ' voltou ' + it.estado + ': avisar Julio, Edton e Mário hoje e separar.');
    }
    h += '<tr><td><span class="cod">' + esc(it.codigo) + '</span><br>' + esc(it.desc) + '</td><td><b>' + fmtN(it.qtd) + '</b></td><td>' + col3 + '</td></tr>';
  });
  h += '</table>';
  h += '<label>Observação (opcional)</label><input value="' + esc(op.obs) + '" onchange="S.op.obs=this.value">';
  alertas.forEach(function (a) { h += '<div class="alerta">⚠ ' + esc(a) + '</div>'; });

  var onde = op.tipo === 'SAIDA' ? 'Estoque › aba Saidas' : op.tipo === 'DEVOLUCAO' ? 'Estoque › aba Entradas (DEVOLUÇÃO DE CAMPO)' : 'Ferramentas › abas Movimentacao e Equipamentos';
  h += '<p class="sub" style="margin-top:12px">VOU GRAVAR EM: ' + onde + (op.assinatura.modo === 'tela' ? ' + foto da assinatura no Drive' : '') + '</p></div>';
  h += '<div class="pergunta">Posso fazer?</div>' +
    '<button id="bt-sim" class="btn prim" onclick="confirmar()">✔ SIM, gravar</button>' +
    '<button class="btn sec" onclick="voltarConf()">✖ NÃO, voltar e mudar</button>';
  S.bloqueio = bloqueio;
  render(h);
  checarConf();
}
function checarConf() {
  var b = $('bt-sim'); if (!b) return;
  var ok = true;
  if (S.bloqueio === 'dev') ok = false;
  if (S.bloqueio === 'neg') ok = S.op.itens.every(function (it) {
    var s = saldo(it.codigo); return (s ? s.saldo : 0) - it.qtd >= 0 || it.confirmouNegativo;
  });
  b.disabled = !ok;
}
function voltarConf() {
  if (S.op.tipo.indexOf('_EQ') > 0) passoEquipDetalhe(); else passoItens();
}
function confirmar() {
  var op = S.op;
  if (op.data > hojeLocal()) { aviso('A data não pode ser no futuro.'); return; }
  op.id = uid(); op.pin = S.pin;
  if (op.assinatura.modo === 'papel') avancarFolha(op.tipo.indexOf('_EQ') > 0 ? 'CEQ' : 'CAD', op.assinatura.folha, op.assinatura.linha, op.itens.length);
  S.ultimoId = op.id; S.ultimoOp = op;
  enfileirar(JSON.parse(JSON.stringify(op)));
  S.op = null;
  telaResultado();
}

function telaResultado() {
  S.telaAtual = 'resultado';
  var op = S.ultimoOp, r = S.resultados[op.id];
  var h = '';
  if (!r) {
    h = S.offline
      ? '<div class="okbox" style="background:var(--amar2);color:#713f12">📵 Sem sinal agora.<br>O lançamento ficou GUARDADO no celular e sobe sozinho quando o sinal voltar. Pode continuar trabalhando.</div>'
      : '<div class="carregando">⏳ Gravando na planilha…</div>';
  } else if (r.ok) {
    h = '<div class="okbox">✔ Gravado!' + (r.numero ? '<br>Nº ' + esc(r.numero) : '') + (r.linhas ? ' · ' + r.linhas + ' linha(s)' : '') + '</div>';
    (r.avisos || []).forEach(function (a) { h += '<div class="alerta">⚠ ' + esc(a) + '</div>'; });
    if (op.assinatura && op.assinatura.modo === 'papel') h += '<p>Marque na folha do caderno: <b>“Lançado / ' + br(hojeLocal()).slice(0, 5) + '”</b>.</p>';
  } else {
    h = '<div class="erro">✖ NÃO foi gravado.<br>' + esc(r.erro) + '</div><p>Nada foi gravado. Confira e faça de novo, ou lance pelo agente às 15h30.</p>';
  }
  var prox = op.tipo.indexOf('_EQ') > 0 ? ['telaEquip()', '🔧 Outra ferramenta'] : op.tipo === 'PENDENCIA' ? ['telaNaoAchei()', '❓ Outra pendência']
    : op.tipo === 'DEVOLUCAO' ? ['iniciar(\'DEVOLUCAO\')', '↩️ Outra devolução'] : ['iniciar(\'SAIDA\')', '➖ Outra saída'];
  h += '<button class="btn prim" onclick="' + prox[0] + '">' + prox[1] + '</button>' +
    '<button class="btn sec" onclick="telaInicio()">🏠 Tela inicial</button>';
  render(h);
  faixa();
}

// ------------------------------------------------------------ CONSULTAR SALDO
function telaSaldo() {
  S.op = null;
  telaPicker('🔍 Consultar saldo', function (cod) { mostrarSaldo(cod); }, 'telaInicio()');
}
function mostrarSaldo(cod) {
  S.telaAtual = 'saldo';
  var it = item(cod) || { d: '', u: '' }, s = saldo(cod);
  var cor = !s ? 'var(--amar)' : s.saldo < 0 ? 'var(--verm)' : 'var(--verde)';
  var h = topo('Saldo', 'telaSaldo()') + '<div class="cartao"><span class="cod">' + esc(cod) + '</span><h2>' + esc(it.d) + '</h2>' +
    '<div class="grande" style="color:' + cor + '">' + (s ? fmtN(s.saldo) : '—') + ' <span style="font-size:22px">' + esc(it.u) + '</span></div>' +
    '<p>' + (s ? esc(s.sit) : 'Sem linha na aba Estoque') + '</p>' +
    '<p class="sub">Última contagem: ' + (s && s.ult ? br(s.ult) : 'nunca contado') + '</p>' +
    (s && s.saldo < 0 ? '<div class="alerta">Saldo negativo: falta lançar entrada ou o item não foi contado. Normal antes do inventário.</div>' : '') +
    '</div>';
  var quem = [];
  Object.keys(S.dados.abertos).forEach(function (k) { var q = S.dados.abertos[k].itens[cod]; if (q > 0) quem.push(S.dados.abertos[k].nome + ': ' + fmtN(q)); });
  if (quem.length) h += '<h3>Retirado e ainda não devolvido</h3><div class="cartao">' + quem.map(esc).join('<br>') + '</div>';
  h += '<button class="btn sec" onclick="telaSaldo()">🔍 Consultar outro</button><button class="btn sec" onclick="telaInicio()">🏠 Tela inicial</button>';
  render(h);
}

// ------------------------------------------------------------ FERRAMENTAS E EQUIPAMENTOS
function telaEquip() {
  S.telaAtual = 'equip'; S.op = null; S.eqSel = null;
  var h = topo('🔧 Ferramentas') +
    '<input id="bq" placeholder="🔎 Nome ou código (EQP-…)" autocomplete="off" oninput="listarEquip()">' +
    '<div class="chips" id="eq-f"></div><div id="eq-res" class="lista"></div>';
  render(h);
  S.eqFiltro = S.eqFiltro || 'todos';
  listarEquip();
}
function eqFiltro(f) { S.eqFiltro = f; listarEquip(); }
function statusEq(x) {
  if (/MANUTEN|BAIXAD/.test(norm(x.st))) return '<span class="chip neg">' + esc(x.st) + '</span>';
  if (x.lote > 1) return x.qtdFora ? '<span class="chip am">' + x.disp + ' de ' + x.lote + ' aqui</span>' : '<span class="chip ok">' + x.lote + ' aqui</span>';
  if (x.qtdFora) return '<span class="chip am">com ' + esc(x.fora[0].nome) + '</span>';
  return '<span class="chip ok">disponível</span>';
}
function listarEquip() {
  var f = S.eqFiltro;
  $('eq-f').innerHTML = [['todos', 'Todos'], ['aqui', 'Disponíveis'], ['fora', 'Fora']].map(function (x) {
    return '<button class="' + (f === x[0] ? 'sel' : '') + '" onclick="eqFiltro(\'' + x[0] + '\')">' + x[1] + '</button>';
  }).join('');
  var toks = norm($('bq').value).split(' ').filter(String);
  var l = S.dados.equip.filter(function (x) {
    if (f === 'aqui' && !x.disp) return false;
    if (f === 'fora' && !x.qtdFora) return false;
    var alvo = norm(x.c + ' ' + x.n + ' ' + x.tipo);
    return toks.every(function (t) { return alvo.indexOf(t) >= 0; });
  });
  var h = '';
  if (!S.dados.equip.length) h = '<div class="alerta">Nenhuma ferramenta cadastrada ainda. O cadastro vem do levantamento do inventário (agente CONTAGEM).</div>';
  l.forEach(function (x) {
    h += '<button class="opcao" onclick="abrirEquip(\'' + esc(x.c) + '\')"><span><span class="cod">' + esc(x.c) + '</span><br><span class="desc">' + esc(x.n) + '</span>' +
      (x.qtdFora && x.desde ? '<br><span class="sub">desde ' + br(x.desde) + '</span>' : '') + '</span><span class="dir">' + statusEq(x) + '</span></button>';
  });
  $('eq-res').innerHTML = h || '<p class="sub">Nada encontrado.</p>';
}
function abrirEquip(cod) {
  S.telaAtual = 'equip-item';
  var x = S.dados.equip.filter(function (y) { return y.c === cod; })[0];
  S.eqSel = x;
  var bloq = /MANUTEN|BAIXAD/.test(norm(x.st));
  var h = topo('🔧 ' + esc(x.c), 'telaEquip()') + '<div class="cartao"><h2>' + esc(x.n) + '</h2><p>' + statusEq(x) + '</p>' +
    (x.lote > 1 ? '<p class="sub">Lote de ' + x.lote + ' unidades</p>' : '') +
    x.fora.map(function (f) { return '<p>Com <b>' + esc(f.nome) + '</b>' + (x.lote > 1 ? ' (' + f.qtd + ')' : '') + (f.desde ? ' desde ' + br(f.desde) : '') + '</p>'; }).join('') +
    '</div>';
  if (bloq) h += '<div class="alerta">Está "' + esc(x.st) + '". Não pode sair.</div>';
  if (x.disp > 0 && !bloq) h += '<button class="btn perigo" onclick="iniciarEq(\'RETIRADA_EQ\')">➖ RETIRAR</button>';
  if (x.qtdFora > 0) h += '<button class="btn prim" onclick="iniciarEq(\'DEVOLUCAO_EQ\')">↩️ DEVOLVER</button>';
  render(h);
}
function iniciarEq(tipo) {
  var x = S.eqSel;
  S.op = { tipo: tipo, data: hojeLocal(), pessoa: '', setor: '', obs: '', assinatura: null,
    itens: [{ codigo: x.c, desc: x.n, qtd: 1, estado: 'OK' }] };
  if (tipo === 'DEVOLUCAO_EQ' && x.fora.length === 1) S.op.pessoa = x.fora[0].nome;
  passoPessoa();
}
function passoEquipDetalhe() {
  S.telaAtual = 'equip-det';
  var op = S.op, x = S.eqSel, it = op.itens[0], ret = op.tipo === 'RETIRADA_EQ';
  var com = x.fora.filter(function (f) { return norm(f.nome) === norm(op.pessoa); })[0];
  var max = ret ? x.disp : (com ? com.qtd : x.qtdFora);
  var h = topo(ret ? '➖ Retirar' : '↩️ Devolver', 'passoPessoa()') +
    '<div class="cartao"><span class="cod">' + esc(x.c) + '</span><br><b>' + esc(x.n) + '</b><br>' + (ret ? 'Retira: ' : 'Devolve: ') + '<b>' + esc(op.pessoa) + '</b></div>';
  if (!ret && !com) {
    h += '<div class="alerta">⚠ Na planilha, está com ' + esc(x.fora.map(function (f) { return f.nome; }).join(', ')) + ', não com ' + esc(op.pessoa) + '.</div>' +
      '<label><input type="checkbox" style="width:auto" ' + (it.confirmaOutraPessoa ? 'checked' : '') + ' onchange="S.op.itens[0].confirmaOutraPessoa=this.checked"> Confirmo: ' + esc(op.pessoa) + ' devolveu no lugar de ' + esc(x.fora[0].nome) + '</label>';
    it.de = x.fora[0].nome;
  }
  if (x.lote > 1) {
    h += '<label>Quantidade (máx. ' + max + ')</label><div class="qtd"><button onclick="eqQtd(-1,' + max + ')">−</button><input inputmode="numeric" id="eqq" value="' + it.qtd + '" onchange="S.op.itens[0].qtd=Math.min(' + max + ',Math.max(1,Number(this.value)||1))"><button onclick="eqQtd(1,' + max + ')">+</button></div>';
  }
  h += '<div class="pergunta">' + (ret ? 'Estado na saída' : 'Como voltou?') + '</div><div class="chips">' +
    ['OK', 'Defeito', 'Quebrado'].map(function (e) { return '<button class="' + (it.estado === e ? 'sel' : '') + '" onclick="S.op.itens[0].estado=\'' + e + '\';passoEquipDetalhe()">' + (e === 'OK' ? '✔ OK' : e === 'Defeito' ? '⚠ Defeito' : '✖ Quebrado') + '</button>'; }).join('') + '</div>';
  if (!ret && it.estado !== 'OK') h += '<div class="alerta">Separe o item e avise Julio, Edton e Mário hoje.</div>';
  if (ret) {
    h += '<label>Setor (se souber)</label><select onchange="S.op.setor=this.value"><option value="">Sem setor</option>' +
      S.dados.setores.map(function (s) { return '<option value="' + esc(s.c) + '"' + (op.setor === s.c ? ' selected' : '') + '>' + esc(s.c + ' · ' + s.n) + '</option>'; }).join('') + '</select>';
  }
  h += '<button class="btn prim" onclick="fimEquipDetalhe()">Continuar ▶</button>';
  render(h);
}
function eqQtd(d, max) { var it = S.op.itens[0]; it.qtd = Math.min(max, Math.max(1, it.qtd + d)); $('eqq').value = it.qtd; }
function fimEquipDetalhe() {
  var op = S.op, x = S.eqSel, it = op.itens[0];
  if (op.tipo === 'DEVOLUCAO_EQ' && !x.fora.some(function (f) { return norm(f.nome) === norm(op.pessoa); }) && !it.confirmaOutraPessoa) {
    aviso('Confirme quem está devolvendo.'); return;
  }
  passoAssinatura();
}

// ------------------------------------------------------------ NÃO ACHEI O ITEM (pendência p/ POP-04)
function telaNaoAchei() {
  S.telaAtual = 'naoachei'; S.op = null;
  var h = topo('❓ Não achei o item') +
    '<p>Anote aqui. No lote das 15h30 o agente procura no Cadastro, cria o código se for novo (POP-04) e lança. <b>Não invente código.</b></p>' +
    '<label>É saída ou devolução?</label><select id="na-mov"><option>SAÍDA</option><option>DEVOLUÇÃO</option><option>ENTRADA (nota)</option></select>' +
    '<label>Descrição (como a pessoa chama, com medida)</label><input id="na-desc" placeholder="ex.: bucha de redução 50x40">' +
    '<label>Quantidade</label><input id="na-qtd" inputmode="decimal" value="1">' +
    '<label>Quem retira ou devolve</label><input id="na-pes" list="na-pl"><datalist id="na-pl">' + S.dados.pessoas.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
    '<label>Observação</label><input id="na-obs" placeholder="ex.: anotado no caderno folha 12 linha 5">' +
    '<button class="btn prim" onclick="enviarNaoAchei()">✔ Anotar pendência</button>';
  render(h);
}
function enviarNaoAchei() {
  var op = { tipo: 'PENDENCIA', id: uid(), pin: S.pin, movimento: $('na-mov').value, descricao: $('na-desc').value.trim(),
    qtd: numBR($('na-qtd').value), pessoa: $('na-pes').value.trim(), obs: $('na-obs').value.trim(), itens: [] };
  if (op.descricao.length < 3) { aviso('Escreva a descrição.'); return; }
  if (!(op.qtd > 0)) { aviso('Confira a quantidade.'); return; }
  S.ultimoId = op.id; S.ultimoOp = op;
  enfileirar(op);
  telaResultado();
}

// ------------------------------------------------------------ HOJE
function telaHoje() {
  S.telaAtual = 'hoje';
  render(topo('📋 Hoje') + '<div class="carregando">Buscando…</div>');
  rpc('api_hoje', S.pin).then(function (r) {
    if (S.telaAtual !== 'hoje') return;
    if (!r.ok) { render(topo('📋 Hoje') + '<div class="erro">' + esc(r.erro) + '</div>'); return; }
    var h = topo('📋 Hoje');
    var n = fila().length;
    if (n) h += '<div class="alerta">⏳ ' + n + ' lançamento(s) ainda no celular, esperando sinal.</div>';
    h += '<h3>Lançado pelo app hoje (' + r.lancamentos.length + ')</h3><div class="cartao">';
    if (!r.lancamentos.length) h += '<p class="sub">Nada ainda.</p>';
    r.lancamentos.forEach(function (l) {
      h += '<p><b>' + esc(l.hora) + '</b> · ' + esc(nomeTipo(l.tipo)) + ' · ' + esc(l.numero) + '<br><span class="sub">' + esc(l.pessoa) + ' · ' + esc(l.itens) + '</span></p>';
    });
    h += '</div>';
    var f24 = r.fora.filter(function (f) { return f.mais24h; });
    h += '<h3>Ferramentas fora (' + r.fora.length + ')' + (f24.length ? ' · <span class="chip neg">' + f24.length + ' há mais de 1 dia</span>' : '') + '</h3><div class="cartao">';
    if (!r.fora.length) h += '<p class="sub">Tudo no almoxarifado.</p>';
    r.fora.forEach(function (f) {
      h += '<p>' + (f.mais24h ? '🔴 ' : '') + '<b>' + esc(f.c) + '</b> ' + esc(f.n) + '<br><span class="sub">com ' + esc(f.nome) + (f.qtd > 1 ? ' (' + f.qtd + ')' : '') + (f.desde ? ' desde ' + esc(f.desde) : '') + '</span></p>';
    });
    h += '</div><h3>Pendências abertas (' + r.pendencias.length + ')</h3><div class="cartao">';
    if (!r.pendencias.length) h += '<p class="sub">Nenhuma.</p>';
    r.pendencias.forEach(function (p) {
      h += '<p><b>' + esc(p.tipo) + '</b><br>' + esc(p.desc) + ' · ' + esc(p.qtd) + '<br><span class="sub">' + esc(p.pessoa) + ' · ' + esc(p.quando) + '</span></p>';
    });
    h += '</div><p class="sub">As pendências são resolvidas no lote das 15h30 pelos agentes.</p>';
    render(h);
  }).catch(function () { if (S.telaAtual === 'hoje') render(topo('📋 Hoje') + '<div class="erro">Sem sinal agora. Tente de novo daqui a pouco.</div>'); });
}

// ------------------------------------------------------------ PARTIDA
(function partida() {
  S.pin = ler(CH.PIN, '') || '';
  var cache = ler(CH.DADOS, null);
  if (cache) { S.dados = cache; reaplicarFila(); telaInicio(); }
  carregar(!!cache).then(function (ok) {
    if (ok && (!cache || S.telaAtual === 'inicio')) telaInicio();
    processarFila();
  });
})();
</script>
